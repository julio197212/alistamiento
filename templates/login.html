{% extends "base.html" %}
{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 75vh; padding: 20px;">
    <div style="background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 420px; padding: 40px; border-top: 5px solid #0d6efd; text-align: center;">
        
        <!-- LOGO GRANDE ASOCIADO A TU ARCHIVO REAL FAVICON.JPG -->
        <div style="margin-bottom: 25px; display: flex; justify-content: center;">
            <img src="/static/favicon.jpg" alt="Logo Empresa MINGA" 
                 style="width: 140px; height: 140px; object-fit: contain; border: 1px solid #e2e8f0; padding: 10px; border-radius: 12px; background-color: #fafafa;">
        </div>
        
        <h2 style="font-size: 1.6rem; color: #1e293b; font-weight: 700; margin-bottom: 5px; margin-top: 0;">Control de Alistamiento</h2>
        <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 30px; margin-top: 0;">Ingrese sus credenciales de acceso</p>

        <!-- Busca la sección del formulario en tu login.html y déjala exactamente así -->
<form method="POST" action="/login">
    <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Usuario</label>
        <!-- CRÍTICO: El name debe ser "usuario" -->
        <input type="text" name="usuario" required placeholder="Ej. jonas" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1;">
    </div>
    
    <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Contraseña</label>
        <!-- CRÍTICO: El name debe ser "contrasena" -->
        <input type="password" name="contrasena" required placeholder="••••••" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1;">
    </div>
    
    <button type="submit" style="width: 100%; padding: 12px; background-color: #0d6efd; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
        Ingresar al Sistema
    </button>
</form>
    </div>
</div>
{% endblock %}
